      JWT_SECRET: ${JWT_SECRET:?Run python3 scripts/init_env.py}
      SERVICE_PASSWORD: ${SERVICE_PASSWORD:?Run python3 scripts/init_env.py}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_URL: http://payment:8080
      ACCOUNT_URL: http://account:8080
      LEDGER_URL: http://ledger:8080
      FRAUD_URL: http://fraud:8080
      NOTIFICATION_URL: http://notification:8080
      DB_URL: jdbc:postgresql://postgres:5432/bank_payment
      DB_USER: bank_payment
      OUTBOX_ENABLED: 'true'
      SPRING_PROFILES_ACTIVE: lite
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx128m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=32m
        -XX:MaxDirectMemorySize=24m -Xss512k -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    image: banking-ledger-lite/payment:local
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
